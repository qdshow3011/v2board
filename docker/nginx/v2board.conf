server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20m;

    # Logs
    access_log /var/log/nginx/v2board.access.log;
    error_log  /var/log/nginx/v2board.error.log;

    # ---- Laravel pretty URL rewrite ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # ---- PHP-FPM ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Timeouts for long-running requests (subscription generation, etc.)
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    # ---- Deny hidden files (.env, .git, etc.) ----
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ---- Static asset caching ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Health check ----
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
