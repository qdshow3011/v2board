[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:horizon]
command=php artisan horizon
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/www/html/storage/logs/queue/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/html/storage/logs/queue/horizon-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=20

[program:cron]
command=crond -f -l 8
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
