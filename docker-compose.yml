# ============================================================
#  V2Board Docker Compose
#  Services: nginx + php-fpm(supervisor) + mysql + redis
# ============================================================
#
#  Usage:
#    1. cp .env.docker.example .env.docker  && edit values
#    2. docker compose --env-file .env.docker up -d --build
#    3. docker compose logs -f php   (to see admin credentials)
#    4. Visit http://localhost:${NGINX_PORT:-8080}
#
# ============================================================

services:
  # ------------------- PHP-FPM + Supervisor -------------------
  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-v2board}
      DB_USERNAME: ${DB_USERNAME:-v2board}
      DB_PASSWORD: ${DB_PASSWORD:-v2board_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_NAME: ${APP_NAME:-V2Board}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@v2board.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks:
      - v2board-net

  # ------------------- Nginx (with app code baked in) --------
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - php
    expose:
      - "80"
    networks:
      - v2board-net

  # ------------------- MySQL -------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-v2board}
      MYSQL_USER: ${DB_USERNAME:-v2board}
      MYSQL_PASSWORD: ${DB_PASSWORD:-v2board_secret}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - v2board-net

  # ------------------- Redis -------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - v2board-net

# ------------------- Networks & Volumes -------------------
networks:
  v2board-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
